suite: ciliumnetworkpolicy
templates:
  - ciliumnetworkpolicy.yaml
tests:
  - it: renders nothing when allowCiliumIngress is absent
    set:
      policies:
        - name: alpha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alpha
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only for entries that opt in
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
        - name: beta
          podSelector: {}
    asserts:
      - hasDocuments:
          count: 1

  # The whole reason this template exists. Cilium ingress traffic arrives with
  # the RESERVED `ingress` identity; a vanilla NetworkPolicy cannot name it,
  # and a kube-system namespaceSelector does NOT match it (proven in
  # talos docs/policy-lab: HTTP 000 with that rule, 200 with this one).
  - it: allows the reserved ingress entity
    set:
      policies:
        - name: alpha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alpha
          allowCiliumIngress: true
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isAPIVersion:
          of: cilium.io/v2
      - equal:
          path: metadata.name
          value: alpha-cilium-ingress
      - equal:
          path: spec.ingress[0].fromEntities
          value: ["ingress"]
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/name"]
          value: alpha

  - it: restricts to named ports when given
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
          ciliumIngressPorts:
            - port: "3000"
              protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "3000"

  - it: coerces an integer port to a string
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
          ciliumIngressPorts:
            - port: 3000
              protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "3000"

  - it: leaves a string port as a string
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
          ciliumIngressPorts:
            - port: "3000"
              protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "3000"

  - it: omits toPorts entirely when no ports are given
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
    asserts:
      - notExists:
          path: spec.ingress[0].toPorts

  - it: never emits an egress block
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
    asserts:
      - notExists:
          path: spec.egress

  - it: renders nothing when neither entity flag is set
    set:
      policies:
        - name: alpha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alpha
          allowPrometheus: true
    asserts:
      - hasDocuments:
          count: 0

  # The apiserver is hostNetwork and cannot be named by a vanilla
  # NetworkPolicy; the longhorn-webhook precedent allows the whole port
  # instead. `kube-apiserver` is the reserved Cilium identity that names it
  # precisely -- verified live: the caller appears in Hubble as
  # `reserved:kube-apiserver`.
  - it: allows the reserved kube-apiserver entity
    set:
      policies:
        - name: alpha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alpha
          allowKubeApiserver: true
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isAPIVersion:
          of: cilium.io/v2
      - equal:
          path: metadata.name
          value: alpha-cilium-ingress
      - equal:
          path: spec.ingress[0].fromEntities
          value: ["kube-apiserver"]

  # Both entities must land in ONE CiliumNetworkPolicy object, not two --
  # renaming or duplicating the object would orphan the CNPs already
  # deployed in five live namespaces.
  - it: renders one CNP with two ingress rules when both flags are set
    set:
      policies:
        - name: alpha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alpha
          allowCiliumIngress: true
          allowKubeApiserver: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingress[0].fromEntities
          value: ["ingress"]
      - equal:
          path: spec.ingress[1].fromEntities
          value: ["kube-apiserver"]

  - it: coerces an integer kubeApiserverPorts port to a string
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowKubeApiserver: true
          kubeApiserverPorts:
            - port: 9443
              protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "9443"

  - it: omits toPorts entirely when no kubeApiserverPorts are given
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowKubeApiserver: true
    asserts:
      - notExists:
          path: spec.ingress[0].toPorts

  - it: never emits an egress block for the kube-apiserver rule
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowKubeApiserver: true
    asserts:
      - notExists:
          path: spec.egress

  - it: renders the host and remote-node entities when allowNodes is set
    set:
      policies:
        - name: vector
          allowNodes: true
          nodePorts:
            - port: 5170
              protocol: TCP
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingress[0].fromEntities
          value:
            - host
            - remote-node
      # A NodePort DNATs to a pod that may be on ANOTHER node, so `host` alone
      # is not enough -- remote-node is the case that actually drops.
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "5170"

  - it: renders no CiliumNetworkPolicy when allowNodes is absent
    set:
      policies:
        - name: vector
          allowPrometheus: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not emit a bare ingress key when only egress is requested
    set:
      policies:
        - name: alpha
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alpha
          egress:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      # A bare `ingress:` on an egress-only policy is ambiguous and may read as
      # deny-all-ingress. It must be absent entirely.
      - notExists:
          path: spec.ingress

  - it: renders no egress section unless egress.enabled is true
    set:
      policies:
        - name: alpha
          podSelector: {}
          allowCiliumIngress: true
          egress:
            # enabled deliberately absent; the sub-keys below must NOT be
            # enough on their own to switch this workload to default-deny egress
            toEntities: [world]
            toFQDNs:
              - matchName: example.com
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.egress

  - it: always emits the kube-dns allow when egress is enabled
    set:
      policies:
        - name: alpha
          podSelector: {}
          egress:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      # DNS is not a key the author can forget. Omitting it produces a
      # name-resolution failure that reads exactly like a policy drop against
      # the real destination.
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels["k8s-app"]
          value: kube-dns
      - equal:
          path: spec.egress[0].toPorts[0].ports[0].port
          value: "53"
      - equal:
          path: spec.egress[0].toPorts[0].ports[1].port
          value: "53"
