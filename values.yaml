# One release per namespace. `policies` is a LIST so a single release covers
# every workload in that namespace -- the openbao namespace needs bao and its
# snapshot CronJob, monitoring needs several.
#
# Egress is opt-in per entry via the `egress` key below. Setting it enables
# default-deny egress for the selected pods -- see the `egress` block in the
# commented example for why `enabled` is required and DNS is automatic.
policies: []
  # - name: wikijs
  #   # Standard Kubernetes label selector. `{}` selects EVERY pod in the
  #   # namespace, which is sometimes exactly right (see openbao) and
  #   # sometimes far too broad.
  #   podSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: wiki
  #
  #   # Without this the namespace is simply never scraped: the target goes
  #   # down, the metric vanishes, and nothing else reports a problem.
  #   allowPrometheus: true
  #
  #   # REQUIRED for anything reachable on a public hostname. Renders a
  #   # CiliumNetworkPolicy, NOT a NetworkPolicy rule, because Cilium ingress
  #   # traffic arrives with the reserved `ingress` identity which a vanilla
  #   # policy cannot name. Proven in talos docs/policy-lab: without it a
  #   # public app returns HTTP 000 and times out.
  #   allowCiliumIngress: true
  #
  #   # Optional. Omit to allow the ingress proxy on every port.
  #   ciliumIngressPorts:
  #     - port: "3000"
  #       protocol: TCP
  #
  #   # For admission webhooks. The apiserver is hostNetwork, same problem as
  #   # Cilium ingress above -- a vanilla NetworkPolicy cannot name it. The
  #   # longhorn-webhook precedent instead allows the whole port with no
  #   # `from:`, which admits any source on it; this names the real caller
  #   # precisely via Cilium's reserved `kube-apiserver` entity. Renders into
  #   # the SAME CiliumNetworkPolicy as allowCiliumIngress, as a second
  #   # ingress rule, not a second object.
  #   allowKubeApiserver: true
  #
  #   # Optional, same shape and same string-port requirement as
  #   # ciliumIngressPorts. Omit to allow the apiserver on every port.
  #   kubeApiserverPorts:
  #     - port: "9443"
  #       protocol: TCP
  #
  #   # Raw NetworkPolicy ingress rules, appended verbatim.
  #   extraIngress: []

  #   # Traffic from a cluster NODE. Needed by any workload behind a NodePort:
  #   # the node DNATs the external connection to a pod that may live on a
  #   # DIFFERENT node, and Cilium's allow-localhost covers only the same-node
  #   # case. Uses the reserved `host` and `remote-node` entities, not an
  #   # ipBlock -- Cilium resolves reserved identities before any CIDR match.
  #   allowNodes: true
  #
  #   # Optional, same shape and string-port requirement as the other entity
  #   # port lists. Omit to allow node traffic on every port.
  #   nodePorts:
  #     - port: "5170"
  #       protocol: TCP

  #   # EGRESS. Rendered into the CiliumNetworkPolicy, never the vanilla
  #   # NetworkPolicy -- vanilla egress can only express CIDRs, and this needs
  #   # reserved entities and FQDNs.
  #   #
  #   # `enabled` is REQUIRED and deliberate. A CiliumNetworkPolicy carrying any
  #   # egress content makes the selected endpoints DEFAULT-DENY for egress, so
  #   # setting one sub-key must not be enough to switch a workload over.
  #   #
  #   # DNS to kube-dns is emitted AUTOMATICALLY whenever this is enabled. It is
  #   # not a key you can forget.
  #   egress:
  #     enabled: true

