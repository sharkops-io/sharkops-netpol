{{/*
THE INGRESS PATH, and it is required rather than optional for any workload
reachable on a public hostname.

A public hostname resolves to the cilium-ingress LoadBalancer, so the traffic
re-enters the cluster through Cilium's Ingress proxy and arrives with the
RESERVED `ingress` identity -- not `host`, and not a pod in kube-system. The
"host->pod is auto-allowed" rule that kubelet probes rely on does NOT extend
to it, and because it is a reserved identity Cilium resolves it before any
CIDR match, so an ipBlock is not a reliable way to express it either.

Measured in talos docs/policy-lab against a real Ingress through the live
LoadBalancer, from outside the cluster:

  no policy                           -> HTTP 200
  netpol with namespaceSelector       -> HTTP 000, 8s timeout, BLOCKED
    kube-system
  that + this CNP                     -> HTTP 200 in 6ms

Omitting this is what took every another-app integration down on 2026-08-16.

The same CNP also carries the `kube-apiserver` reserved entity, for
admission-webhook traffic. The apiserver is hostNetwork and cannot be named
by a vanilla NetworkPolicy either -- the longhorn-webhook precedent works
around that by allowing the whole port with no `from:` at all, which admits
any source on it. `kube-apiserver` names the real caller precisely. Verified
live: the caller appears in Hubble as `reserved:kube-apiserver`.

Both entities render into ONE object, as separate entries in the same
`ingress` list, rather than a second CiliumNetworkPolicy -- and the object
keeps its existing `<name>-cilium-ingress` name even when it is carrying only
the apiserver rule, so as not to orphan the CNPs already deployed in five
live namespaces.
*/}}
{{- range $p := .Values.policies }}
{{- if or $p.allowCiliumIngress $p.allowKubeApiserver $p.allowNodes $p.extraCiliumIngress (and $p.egress $p.egress.enabled) }}
{{- $hasIngress := or $p.allowCiliumIngress $p.allowKubeApiserver $p.allowNodes $p.extraCiliumIngress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $p.name }}-cilium-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  endpointSelector:
    {{- toYaml (default dict $p.podSelector) | nindent 4 }}
  {{- if $hasIngress }}
  ingress:
    {{- if $p.allowCiliumIngress }}
    - fromEntities:
        - ingress
      {{- with $p.ciliumIngressPorts }}
      toPorts:
        - ports:
            {{- range . }}
            # Cilium's CRD requires port to be a STRING. Quoting here means a
            # values file may write either `port: 3000` or `port: "3000"` and
            # both render correctly -- an unquoted int is otherwise rejected
            # only at apply time, by which point it is in a merge request.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
    {{- if $p.allowNodes }}
    # Traffic arriving FROM A CLUSTER NODE, e.g. a NodePort service where the
    # node DNATs an external connection to a pod that may be on a DIFFERENT
    # node. Cilium's allow-localhost covers host->pod on the SAME node only;
    # the remote-node case is not auto-allowed and is silently dropped.
    #
    # Expressed as reserved entities rather than an ipBlock of the node subnet
    # ON PURPOSE. Cilium resolves reserved identities BEFORE any CIDR match, so
    # a 192.168.20.0/24 ipBlock does not reliably admit node traffic -- the same
    # reason allowCiliumIngress exists rather than an ipBlock for the LB.
    #
    # Found 2026-08-19: Talos ships node logs to vector:5170 via a NodePort, and
    # ~4 drops/sec had been discarded continuously since the logging namespace
    # was default-denied. Nothing reported it -- no unhealthy pod, no down
    # target, no alert. Pod-log ingestion via alloy kept working, so the log
    # stack looked entirely healthy.
    - fromEntities:
        - host
        - remote-node
      {{- with $p.nodePorts }}
      toPorts:
        - ports:
            {{- range . }}
            # Cilium's CRD requires port to be a STRING, same as the other
            # entity blocks in this file.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
    {{- if $p.allowKubeApiserver }}
    - fromEntities:
        - kube-apiserver
      {{- with $p.kubeApiserverPorts }}
      toPorts:
        - ports:
            {{- range . }}
            # Same STRING requirement as ciliumIngressPorts above.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
    {{- with $p.extraCiliumIngress }}
    # RAW CILIUM INGRESS RULES, appended verbatim -- the ingress mirror of
    # `egress.extraEgress`.
    #
    # THE ONE THING IT EXISTS FOR IS INGRESS ICMP, and that is not a niche.
    # `extraIngress` renders into the VANILLA NetworkPolicy, which has no
    # concept of ICMP at all, and the `icmps:` hooks in this file are all on
    # the egress side. So before 0.12.0 there was NO WAY to allow an inbound
    # ICMP type -- while the automatic egress rule above allows five of them.
    # That asymmetry was the bug, not a missing feature.
    #
    # It cost the CoreDNS policy. Applied 2026-08-26 and withdrawn the same
    # day: default-deny ingress ALSO denies inbound **Destination Unreachable**
    # (IPv4 type 3, IPv6 type 1) from clients answering a LATE DNS reply -- they
    # already had their answer from the other replica, so the response hit a
    # closed socket. Harmless, and CoreDNS ignores them, but it pinned
    # `AttributablePolicyDrops` firing continuously, and a permanently-firing
    # alert is worse than an un-policed resolver. Note the shape of that
    # failure: DNS never broke, no pod restarted, and every probe passed. The
    # policy was CORRECT and still had to come out.
    #
    # THE GENERAL LESSON, which is why this hatch is raw rather than a typed
    # `allowIcmp` list: a capture filtered to the port you are policing is
    # structurally blind to everything else the same default-deny rule will
    # drop. The CoreDNS derivation missed the kubelet probes on 8080/8181 the
    # same way (caught by reading the Deployment) and then missed the ICMP
    # (caught in production). What lands here next will be something else again.
    #
    # Content is NOT validated or reshaped -- it is spliced into the `ingress:`
    # list as written, so it must be valid CiliumNetworkPolicy ingress YAML.
    # Remember that Cilium's CRD wants `port` as a STRING.
    #
    # *** SETTING THIS ALONE MAKES THE ENDPOINT DEFAULT-DENY FOR INGRESS. ***
    # Any CNP carrying ingress content does, exactly as any egress content makes
    # it default-deny for egress. Adding an ICMP allowance to a workload that
    # had no ingress policy does not "also allow ICMP" -- it denies everything
    # else. Pair it with the real ingress rules, never on its own.
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if and $p.egress $p.egress.enabled }}
  egress:
    # ALWAYS FIRST, ALWAYS PRESENT. A CiliumNetworkPolicy carrying any egress
    # content makes the selected endpoints DEFAULT-DENY for egress (policy-lab
    # T4). Without DNS, name resolution fails first and the failure reads
    # exactly like a policy drop against the real destination -- sending the
    # reader to debug the wrong rule. This is a trap already paid for in the
    # lab; it is emitted automatically so it cannot be forgotten.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        {{- if $p.egress.dnsVisibility }}
        # DNS VISIBILITY. The L7 `rules.dns` block is what puts Cilium's DNS
        # proxy in path for these endpoints. Without it the rule is L3/L4 only:
        # resolution still works, but nothing observes it -- no
        # hubble_dns_queries_total, and `toFQDNs` below silently matches
        # NOTHING, failing as a drop against the real destination.
        #
        # `protocol: ANY` rather than the UDP+TCP pair used below. This is the
        # exact shape running in 20 namespaces since 2026-08-20, kept verbatim
        # rather than reasoned about: an L7 rule attached to a two-entry port
        # list is not a combination this cluster has ever proven, and a
        # CiliumNetworkPolicy the agent rejects looks identical to one it
        # accepted until you query for flows that never arrive.
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
        {{- else }}
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
        {{- end }}
    # ALWAYS SECOND, ALWAYS PRESENT, for the same reason the DNS rule is always
    # first: egress default-deny drops ALL pod-originated ICMP, and both things
    # that breaks are invisible in different ways.
    #
    # VISIBLE: ICMPv6 Neighbour Solicitation (135) and Advertisement (136) to
    # other pods become ATTRIBUTABLE policy drops -- both identities present --
    # which is precisely the shape `AttributablePolicyDrops` exists to catch.
    # Rolling egress out to five namespaces on 2026-08-21 took that alert from a
    # 12-16/h baseline to 319/h and put it into `pending`. An alert for real
    # drops that fires permanently on harmless ones is worse than no alert.
    #
    # INVISIBLE AND WORSE: it also drops **Packet Too Big** (ICMPv6 type 2) and
    # IPv4 **Destination Unreachable** (type 3, which carries Fragmentation
    # Needed). Those two ARE Path MTU Discovery. Dropping them is an MTU black
    # hole: large transfers hang, nothing is logged, and no alert fires. This
    # cluster has already lost days to exactly that on the dind runners -- curl
    # exit 35 at exactly ~127s -- so it is a known, paid-for failure mode.
    #
    # Scoped to `cluster` rather than `all`: pod-to-pod neighbour discovery and
    # in-cluster PMTUD are what default-deny broke. It is NOT scoped to the
    # kube-dns endpoints, because ND is between arbitrary pod pairs.
    - toEntities:
        - cluster
      icmps:
        - fields:
            # Neighbour Discovery. Cilium handles ND below the policy layer so
            # nothing observably breaks without these, but every solicitation
            # is recorded as an attributable drop.
            - type: 135
              family: IPv6
            - type: 136
              family: IPv6
            # PATH MTU DISCOVERY -- the load-bearing pair. Do not remove.
            - type: 2
              family: IPv6
            - type: 3
              family: IPv4
            # IPv6 Destination Unreachable -- the direct counterpart of the
            # IPv4 type 3 above. ADDED 0.9.0: its absence was a FAMILY
            # ASYMMETRY, not a deliberate omission, and it was denying real
            # pod-to-pod traffic (observed from wikijs on the cluster's IPv6
            # pod CIDR). Same silent-failure class as PMTUD.
            - type: 1
              family: IPv6
    # ALWAYS THIRD, ALWAYS PRESENT. ADDED 0.9.0.
    #
    # IPv6 link-local multicast housekeeping, which every dual-stack pod emits
    # at startup:
    #     type 133  Router Solicitation          -> ff02::2
    #     type 143  MLDv2 Listener Report        -> ff02::16
    #
    # *** THIS CANNOT BE FOLDED INTO THE RULE ABOVE. *** Those destinations are
    # link-local multicast, which Cilium classifies as `reserved:world-ipv6` and
    # NOT as `cluster`. Adding the two types to the `cluster` rule renders valid
    # YAML, reads as correct, and still denies every one of them.
    #
    # Found in production: `AttributablePolicyDrops` came BACK after the Stage
    # 1/2 egress rollout -- pgadmin, wikijs and plex, each from its own rollout
    # time -- and was paging on Slack. 0.8.0 fixed Neighbour Discovery and
    # PMTUD but left these, so the alert became permanent noise again.
    #
    # Scoped to ff02::/16, never `world`: link-local multicast is not routable
    # off the link, so this grants nothing that can leave the node.
    - toCIDRSet:
        - cidr: "ff02::/16"
      icmps:
        - fields:
            - type: 133
              family: IPv6
            - type: 143
              family: IPv6
    {{- with $p.egress.toEntities }}
    - toEntities:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $p.egress.toEndpoints }}
    {{- range . }}
    # IN-CLUSTER destinations, named by label. One rule PER ENTRY, never a
    # shared toPorts across several endpoints -- Cilium would then permit ANY
    # listed endpoint on ANY listed port, so `sonarr` would become reachable on
    # qbittorrent's 8080. That over-grant renders as valid YAML and reads as
    # correct, which is why the tests assert the separation directly.
    - toEndpoints:
        - matchLabels:
            {{- toYaml .matchLabels | nindent 12 }}
          {{- with .matchExpressions }}
          # OPTIONAL, and the ONLY way to say "in ANY namespace". A
          # CiliumNetworkPolicy is namespaced, and Cilium INJECTS the policy's
          # own namespace into any toEndpoints selector that does not already
          # mention `io.kubernetes.pod.namespace` -- so OMITTING the key does
          # not mean "any namespace", it means "this policy's namespace", and
          # the resulting rule is a silent no-op against pods elsewhere.
          #
          # Naming the key with `operator: Exists` is what suppresses the
          # injection: getEndpointSelector only injects when
          # `!es.HasKey(podPrefixLbl) && !es.HasKey(podAnyPrefixLbl)`
          # (pkg/k8s/apis/cilium.io/utils/utils.go), and HasKey scans
          # MatchExpressions as well as MatchLabels
          # (pkg/policy/api/selector.go). Verified against the live agent, not
          # just the source: an existing cross-namespace rule realises in
          # `cilium-dbg policy get` as `any:io.kubernetes.pod.namespace: <ns>`
          # with no second, injected match.
          #
          # PAIR IT WITH A matchLabels THAT IS ACTUALLY SELECTIVE. Dropping the
          # namespace constraint means a bare `app: foo` now matches that label
          # in EVERY namespace, so prefer labels an operator sets and no user
          # can forge, and require more than one.
          matchExpressions:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .toPorts }}
      toPorts:
        - ports:
            {{- range . }}
            # STRING, per Cilium's CRD. `toYaml` passes an int straight through
            # and helm-unittest cannot catch the type error -- it renders valid
            # YAML and only the API server rejects it. Quoting here lets a
            # values file write either form.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with $p.egress.toCIDR }}
    {{- $ported := list }}
    {{- $bare := list }}
    {{- range . }}
      {{- if .toPorts }}{{ $ported = append $ported . }}{{ else }}{{ $bare = append $bare . }}{{ end }}
    {{- end }}
    {{- with $bare }}
    # Un-ported entries stay grouped in ONE rule, so every policy written before
    # toPorts existed renders byte-identically and no deployed object churns.
    - toCIDRSet:
        {{- range . }}
        - {{ if .cidrGroupRef }}cidrGroupRef: {{ .cidrGroupRef }}{{ else }}cidr: {{ .cidr }}{{ end }}
          {{- with .except }}
          except:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- range $ported }}
    # A ported entry gets its OWN rule, for the same reason as toEndpoints
    # above: a shared toPorts would open every listed port on every listed host.
    # Concretely, it is the difference between reaching the LAN gateway on 443
    # and reaching it on everything.
    - toCIDRSet:
        - {{ if .cidrGroupRef }}cidrGroupRef: {{ .cidrGroupRef }}{{ else }}cidr: {{ .cidr }}{{ end }}
          {{- with .except }}
          except:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      toPorts:
        - ports:
            {{- range .toPorts }}
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
    {{- end }}
    {{- end }}
    {{- if $p.egress.allowKubeApiserver }}
    # The apiserver is hostNetwork and cannot be named by a vanilla
    # NetworkPolicy. Anything driving `kubectl exec` -- the wal-switch CronJobs
    # -- needs this.
    - toEntities:
        - kube-apiserver
    {{- end }}
    {{- with $p.egress.toFQDNs }}
    {{- /*
      Un-ported entries stay grouped in ONE rule so pre-toPorts policies render
      byte-identically. This is a TEMPLATE comment, not a YAML one, and it sits
      HERE rather than beside the bare branch on purpose: a rendered comment is
      still a manifest diff. Putting it next to `- toFQDNs:` churned 8 unrelated
      live releases in testing -- identical policy, but helmfile upgrades every
      one of them. A template comment on its own line also leaves a blank line
      behind, so it must sit between directives that already chomp whitespace.
    */}}
    {{- $ported := list }}
    {{- $bare := list }}
    {{- range . }}
      {{- if .toPorts }}{{ $ported = append $ported . }}{{ else }}{{ $bare = append $bare . }}{{ end }}
    {{- end }}
    {{- with $bare }}
    # toFQDNs requires the Cilium DNS proxy to be in path for the selected
    # endpoints, which happens only where an L7 DNS rule applies -- i.e. only
    # when `dnsVisibility: true` is set above. Setting toFQDNs without it does
    # not error; it matches nothing, and the traffic is denied as though the
    # allowlist were wrong.
    - toFQDNs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- range $ported }}
    # A ported entry gets its OWN rule, for the same reason as toEndpoints and
    # toCIDR above: a shared toPorts would open every listed port on every
    # listed NAME.
    #
    # This matters more for FQDNs than it looks, because a name can resolve to
    # a host that runs far more than the one service being allowed. Concretely:
    # `*.plex.direct` resolves to the LAN machine hosting Plex, which also runs
    # a container stack, a CI runner and a DNS resolver -- so an un-ported rule
    # for it is not "allow Plex", it is "allow that whole host".
    - toFQDNs:
        {{- toYaml (list (omit . "toPorts")) | nindent 8 }}
      toPorts:
        - ports:
            {{- range .toPorts }}
            # STRING, per Cilium's CRD -- same reason as every other port list
            # in this template.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
    {{- end }}
    {{- end }}
    {{- with $p.egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
