{{/*
THE INGRESS PATH, and it is required rather than optional for any workload
reachable on a public hostname.

A public hostname resolves to the cilium-ingress LoadBalancer, so the traffic
re-enters the cluster through Cilium's Ingress proxy and arrives with the
RESERVED `ingress` identity -- not `host`, and not a pod in kube-system. The
"host->pod is auto-allowed" rule that kubelet probes rely on does NOT extend
to it, and because it is a reserved identity Cilium resolves it before any
CIDR match, so an ipBlock is not a reliable way to express it either.

Measured in talos docs/policy-lab against a real Ingress through the live
LoadBalancer, from outside the cluster:

  no policy                           -> HTTP 200
  netpol with namespaceSelector       -> HTTP 000, 8s timeout, BLOCKED
    kube-system
  that + this CNP                     -> HTTP 200 in 6ms

Omitting this is what took every another-app integration down on 2026-08-16.

The same CNP also carries the `kube-apiserver` reserved entity, for
admission-webhook traffic. The apiserver is hostNetwork and cannot be named
by a vanilla NetworkPolicy either -- the longhorn-webhook precedent works
around that by allowing the whole port with no `from:` at all, which admits
any source on it. `kube-apiserver` names the real caller precisely. Verified
live: the caller appears in Hubble as `reserved:kube-apiserver`.

Both entities render into ONE object, as separate entries in the same
`ingress` list, rather than a second CiliumNetworkPolicy -- and the object
keeps its existing `<name>-cilium-ingress` name even when it is carrying only
the apiserver rule, so as not to orphan the CNPs already deployed in five
live namespaces.
*/}}
{{- range $p := .Values.policies }}
{{- if or $p.allowCiliumIngress $p.allowKubeApiserver $p.allowNodes (and $p.egress $p.egress.enabled) }}
{{- $hasIngress := or $p.allowCiliumIngress $p.allowKubeApiserver $p.allowNodes }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $p.name }}-cilium-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  endpointSelector:
    {{- toYaml (default dict $p.podSelector) | nindent 4 }}
  {{- if $hasIngress }}
  ingress:
    {{- if $p.allowCiliumIngress }}
    - fromEntities:
        - ingress
      {{- with $p.ciliumIngressPorts }}
      toPorts:
        - ports:
            {{- range . }}
            # Cilium's CRD requires port to be a STRING. Quoting here means a
            # values file may write either `port: 3000` or `port: "3000"` and
            # both render correctly -- an unquoted int is otherwise rejected
            # only at apply time, by which point it is in a merge request.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
    {{- if $p.allowNodes }}
    # Traffic arriving FROM A CLUSTER NODE, e.g. a NodePort service where the
    # node DNATs an external connection to a pod that may be on a DIFFERENT
    # node. Cilium's allow-localhost covers host->pod on the SAME node only;
    # the remote-node case is not auto-allowed and is silently dropped.
    #
    # Expressed as reserved entities rather than an ipBlock of the node subnet
    # ON PURPOSE. Cilium resolves reserved identities BEFORE any CIDR match, so
    # a 192.168.20.0/24 ipBlock does not reliably admit node traffic -- the same
    # reason allowCiliumIngress exists rather than an ipBlock for the LB.
    #
    # Found 2026-08-19: Talos ships node logs to vector:5170 via a NodePort, and
    # ~4 drops/sec had been discarded continuously since the logging namespace
    # was default-denied. Nothing reported it -- no unhealthy pod, no down
    # target, no alert. Pod-log ingestion via alloy kept working, so the log
    # stack looked entirely healthy.
    - fromEntities:
        - host
        - remote-node
      {{- with $p.nodePorts }}
      toPorts:
        - ports:
            {{- range . }}
            # Cilium's CRD requires port to be a STRING, same as the other
            # entity blocks in this file.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
    {{- if $p.allowKubeApiserver }}
    - fromEntities:
        - kube-apiserver
      {{- with $p.kubeApiserverPorts }}
      toPorts:
        - ports:
            {{- range . }}
            # Same STRING requirement as ciliumIngressPorts above.
            - port: {{ .port | quote }}
              {{- with .protocol }}
              protocol: {{ . }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if and $p.egress $p.egress.enabled }}
  egress:
    # ALWAYS FIRST, ALWAYS PRESENT. A CiliumNetworkPolicy carrying any egress
    # content makes the selected endpoints DEFAULT-DENY for egress (policy-lab
    # T4). Without DNS, name resolution fails first and the failure reads
    # exactly like a policy drop against the real destination -- sending the
    # reader to debug the wrong rule. This is a trap already paid for in the
    # lab; it is emitted automatically so it cannot be forgotten.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    {{- with $p.egress.toEntities }}
    - toEntities:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $p.egress.toCIDR }}
    - toCIDRSet:
        {{- range . }}
        - cidr: {{ .cidr }}
          {{- with .except }}
          except:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if $p.egress.allowKubeApiserver }}
    # The apiserver is hostNetwork and cannot be named by a vanilla
    # NetworkPolicy. Anything driving `kubectl exec` -- the wal-switch CronJobs
    # -- needs this.
    - toEntities:
        - kube-apiserver
    {{- end }}
    {{- with $p.egress.toFQDNs }}
    # toFQDNs requires the Cilium DNS proxy to be in path for the selected
    # endpoints, which happens only where an L7 DNS rule applies. The key exists
    # so the interface is complete; nothing should USE it until DNS visibility
    # is enabled for that namespace.
    - toFQDNs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $p.egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
