stages:
  - lint
  - test
  - package
  - deploy

variables:
  CHART_NAME: "sharkops-netpol"

.helm_base: &helm_base
  image: alpine:latest
  before_script:
    - apk add --no-cache helm

.standard_rules: &standard_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  <<: *helm_base
  stage: lint
  script:
    - helm lint .
    - helm template test-release . --debug
  <<: *standard_rules

unit-tests:
  image: alpine:latest
  stage: test
  before_script:
    - apk add --no-cache helm curl git
  script:
    - helm plugin install https://github.com/helm-unittest/helm-unittest
    - helm unittest --strict -f "tests/*.yaml" .
  <<: *standard_rules

package:
  <<: *helm_base
  stage: package
  script:
    - helm package .
    - ls -la *.tgz
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  <<: *helm_base
  stage: deploy
  before_script:
    - apk add --no-cache curl helm
  script:
    - helm package . --version $CI_COMMIT_TAG
    - CHART_FILE=$(ls *.tgz)
    - echo $CI_REGISTRY_PASSWORD | helm registry login registry.gitlab.com --username $CI_REGISTRY_USER --password-stdin
    - helm push $CHART_FILE oci://registry.gitlab.com/sharkops/helm-charts/sharkops-netpol
  rules:
    - if: $CI_COMMIT_TAG
